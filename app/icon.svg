<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0A0A0A"/>

  <!-- Scorpion body -->
  <ellipse cx="14" cy="18" rx="5" ry="3.5" fill="#C4222E"/>

  <!-- Head -->
  <ellipse cx="20" cy="18" rx="2.5" ry="2" fill="#C4222E"/>

  <!-- Tail segments curving up and over -->
  <path d="M 9 17 Q 7 14 8 11 Q 9 8 12 7 Q 15 6 16 9 Q 17 11 15 12"
        stroke="#C4222E" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Stinger -->
  <path d="M 15 12 L 13 10" stroke="#C4222E" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left claw -->
  <path d="M 22 17 Q 26 14 27 12" stroke="#C4222E" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 26 13 L 28 12" stroke="#C4222E" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 27 12 L 27 10" stroke="#C4222E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Right claw -->
  <path d="M 22 19 Q 26 20 27 23" stroke="#C4222E" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 26 22 L 28 23" stroke="#C4222E" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 27 23 L 27 25" stroke="#C4222E" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Legs -->
  <line x1="12" y1="16" x2="10" y2="13" stroke="#C4222E" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="15.5" x2="11" y2="13" stroke="#C4222E" stroke-width="1" stroke-linecap="round"/>
  <line x1="12" y1="20" x2="10" y2="23" stroke="#C4222E" stroke-width="1" stroke-linecap="round"/>
  <line x1="13" y1="21" x2="11" y2="24" stroke="#C4222E" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="15" x2="15" y2="12" stroke="#C4222E" stroke-width="1" stroke-linecap="round"/>
  <line x1="16" y1="21" x2="15" y2="24" stroke="#C4222E" stroke-width="1" stroke-linecap="round"/>
</svg>
